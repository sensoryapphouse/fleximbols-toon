  <!-- top flap (folded flat) -->
  <rect x="80" y="110" width="352" height="70" fill="#a86d2a" stroke="#1a1a1a" stroke-width="5" rx="2"/>
  <!-- main body -->
  <rect x="80" y="180" width="352" height="192" fill="#c8873a" stroke="#1a1a1a" stroke-width="5"/>
  <!-- bottom flap -->
  <rect x="80" y="372" width="352" height="70" fill="#a86d2a" stroke="#1a1a1a" stroke-width="5" rx="2"/>
  <!-- fold lines between flaps and body -->
  <line x1="80"  y1="180" x2="432" y2="180" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="80"  y1="372" x2="432" y2="372" stroke="#1a1a1a" stroke-width="3"/>
  <!-- vertical crease lines showing where box edges were -->
  <line x1="196" y1="110" x2="196" y2="442" stroke="#7a4e1a" stroke-width="4" stroke-dasharray="12,7"/>
  <line x1="316" y1="110" x2="316" y2="442" stroke="#7a4e1a" stroke-width="4" stroke-dasharray="12,7"/>
  <!-- horizontal centre crease -->
  <line x1="80" y1="276" x2="432" y2="276" stroke="#7a4e1a" stroke-width="3" stroke-dasharray="16,8"/>
  <!-- tape strip along centre seam -->
  <rect x="216" y="110" width="80" height="332" fill="#eecc88" stroke="#ccaa60" stroke-width="2" opacity="0.65"/>
