  <title>trade-mark</title>
  <!-- Standard trademark symbol: "TM" as superscript-style on a placeholder word.
       Symbol set at moderate size, properly proportioned. -->
  <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="900" text-anchor="middle">
    <!-- Base word/object (small "X" as anchor) -->
    <text x="200" y="320" font-size="180" fill="#1a1a1a">X</text>
    <!-- TM superscript -->
    <text x="360" y="240" font-size="80" fill="#1a1a1a">TM</text>
  </g>
</svg>
