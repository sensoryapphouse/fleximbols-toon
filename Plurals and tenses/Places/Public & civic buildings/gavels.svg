<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><g transform="translate(256,256) scale(1.049) translate(-336,-249)"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Judge's gavel on round wooden sound block -->

  <!-- Sound block — cylindrical wooden disc -->
  <ellipse cx="340" cy="418" rx="128" ry="34"
           fill="#c08840" stroke="#1a1a1a" stroke-width="5"/>
  <rect x="212" y="390" width="256" height="28"
        fill="#d4a050" stroke="none"/>
  <ellipse cx="340" cy="390" rx="128" ry="34"
           fill="#d4a050" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Block side -->
  <line x1="212" y1="390" x2="212" y2="418" stroke="#1a1a1a" stroke-width="5"/>
  <line x1="468" y1="390" x2="468" y2="418" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Block wood grain ring -->
  <ellipse cx="340" cy="390" rx="90" ry="22"
           fill="none" stroke="#b07830" stroke-width="3"/>

  <!-- Gavel handle (diagonal, lower-left to upper-right) -->
  <!-- Handle as a rounded rect rotated ~-45 deg, centred around midpoint -->
  <rect x="228" y="68" width="56" height="240" rx="14" ry="14"
        fill="#b07830" stroke="#1a1a1a" stroke-width="5"
        transform="rotate(45 256 256)"/>
  <!-- Handle grain lines -->
  <line x1="242" y1="104" x2="218" y2="128"
        stroke="#906020" stroke-width="2.5" stroke-linecap="round"
        transform="rotate(45 256 256)"/>
  <line x1="242" y1="136" x2="218" y2="160"
        stroke="#906020" stroke-width="2.5" stroke-linecap="round"
        transform="rotate(45 256 256)"/>
  <line x1="242" y1="168" x2="218" y2="192"
        stroke="#906020" stroke-width="2.5" stroke-linecap="round"
        transform="rotate(45 256 256)"/>

  <!-- Gavel head (rectangular hammer head, perpendicular to handle) -->
  <!-- Head is perpendicular to handle, so rotate -45 on its own centre -->
  <!-- Place head at upper-right of handle -->
  <rect x="310" y="82" width="130" height="62" rx="12" ry="12"
        fill="#c88840" stroke="#1a1a1a" stroke-width="5"
        transform="rotate(45 375 113)"/>
  <!-- Head cap bands (decorative rings at each striking end) -->
  <rect x="310" y="82" width="22" height="62" rx="6" ry="6"
        fill="#a06820" stroke="#1a1a1a" stroke-width="4"
        transform="rotate(45 375 113)"/>
  <rect x="418" y="82" width="22" height="62" rx="6" ry="6"
        fill="#a06820" stroke="#1a1a1a" stroke-width="4"
        transform="rotate(45 375 113)"/>
</g><g transform="translate(360 8) scale(0.2812)"><defs><radialGradient id="pl2648" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl2648)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
