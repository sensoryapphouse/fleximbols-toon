  <line x1="218" y1="360" x2="294" y2="360" stroke="#1a1a1a" stroke-width="3"/>

  <!-- HAND gripping the bar — skin tone #f3c89c -->
  <!-- Palm body wrapping around handle -->
  <path d="M138 200 Q128 220 130 260 Q132 300 144 330 Q158 362 180 370 Q210 380 220 370 L220 170 Q200 162 180 168 Q158 176 138 200 Z" fill="#f3c89c" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>

