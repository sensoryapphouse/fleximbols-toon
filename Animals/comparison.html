<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; background: #f0f0f0; margin: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
  .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
  img { max-width: 100%; height: 250px; }
  h2 { grid-column: 1 / -1; margin-bottom: 0; }
  h3 { color: #555; }
</style>
</head>
<body>
  <h1>SVG Comparison</h1>
  
  <div class="grid">
    <h2>Panda</h2>
    <div class="card">
      <h3>Original (Sensory App House)</h3>
      <img src="Wild & zoo mammals/panda.svg" />
    </div>
    <div class="card">
      <h3>My Generation</h3>
      <img src="test_panda.svg" />
    </div>

    <h2>Owl</h2>
    <div class="card">
      <h3>Original (Sensory App House)</h3>
      <img src="Birds/owl.svg" />
    </div>
    <div class="card">
      <h3>My Generation</h3>
      <img src="test_owl.svg" />
    </div>

    <h2>Bee</h2>
    <div class="card">
      <h3>Original (Sensory App House)</h3>
      <img src="Minibeasts & insects/bee.svg" />
    </div>
    <div class="card">
      <h3>My Generation</h3>
      <img src="test_bee.svg" />
    </div>

    <h2>Crab</h2>
    <div class="card">
      <h3>Original (Sensory App House)</h3>
      <img src="Sea/crab.svg" />
    </div>
    <div class="card">
      <h3>My Generation</h3>
      <img src="test_crab.svg" />
    </div>

    <h2>Wolf</h2>
    <div class="card">
      <h3>Original (Sensory App House)</h3>
      <img src="Wild & zoo mammals/wolf.svg" />
    </div>
    <div class="card">
      <h3>My Generation (Geometric)</h3>
      <img src="test_wolf.svg" />
    </div>
  </div>
</body>
</html>
