  <!-- Male symbol (blue) — circle top-left, arrow pointing upper-right -->
  <circle cx="188" cy="200" r="80"
          fill="#4a9fe6" stroke="#1a1a1a" stroke-width="6"/>
  <!-- Arrow shaft -->
  <line x1="248" y1="142" x2="350" y2="80"
        stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polyline points="304,74 350,80 344,126"
            fill="none" stroke="#1a1a1a" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Female symbol (pink) — circle lower-right, cross below -->
  <circle cx="324" cy="282" r="80"
          fill="#e63a8a" stroke="#1a1a1a" stroke-width="6"/>
  <!-- Vertical stem -->
  <line x1="324" y1="362" x2="324" y2="460"
        stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="280" y1="420" x2="368" y2="420"
        stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
