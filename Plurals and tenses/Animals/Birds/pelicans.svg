  <g stroke="#000000" stroke-width="3.228" stroke-linejoin="round" stroke-linecap="round">
    <!-- water line -->
    <path d="M10 200 Q150 210 280 200" fill="none" stroke="#3b6fb0" stroke-width="3.228"/>
    <!-- body: plump white pelican floating -->
    <path d="M70 150 Q60 110 110 102 Q160 96 200 120 Q236 140 236 168 Q236 196 196 198 L100 198 Q66 192 70 150 Z"
