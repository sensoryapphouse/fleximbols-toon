  <!-- main plaster strip, slightly rotated -->
  <g transform="translate(256 256) rotate(-15) translate(-256 -256)">
    <!-- outer strip body (skin/pink) -->
    <rect x="96" y="216" width="320" height="80" rx="18" fill="#f3c89c" stroke="#1a1a1a" stroke-width="5"/>
    <!-- left end cross-hatch pad texture -->
    <rect x="96" y="216" width="80" height="80" rx="18" fill="#e8a87a" stroke="#1a1a1a" stroke-width="5"/>
    <!-- right end cross-hatch pad texture -->
    <rect x="336" y="216" width="80" height="80" rx="18" fill="#e8a87a" stroke="#1a1a1a" stroke-width="5"/>
    <!-- centre pad (white gauze) -->
    <rect x="196" y="224" width="120" height="64" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="4"/>
    <!-- gauze dots -->
    <circle cx="220" cy="250" r="4" fill="#d0d0d0" stroke="none"/>
    <circle cx="240" cy="262" r="4" fill="#d0d0d0" stroke="none"/>
    <circle cx="260" cy="250" r="4" fill="#d0d0d0" stroke="none"/>
    <circle cx="280" cy="262" r="4" fill="#d0d0d0" stroke="none"/>
    <circle cx="300" cy="250" r="4" fill="#d0d0d0" stroke="none"/>
    <!-- left end dot grid -->
    <circle cx="128" cy="244" r="3" fill="#c89060" stroke="none"/>
    <circle cx="148" cy="244" r="3" fill="#c89060" stroke="none"/>
    <circle cx="128" cy="264" r="3" fill="#c89060" stroke="none"/>
    <circle cx="148" cy="264" r="3" fill="#c89060" stroke="none"/>
    <circle cx="128" cy="284" r="3" fill="#c89060" stroke="none"/>
    <circle cx="148" cy="284" r="3" fill="#c89060" stroke="none"/>
    <!-- right end dot grid -->
    <circle cx="360" cy="244" r="3" fill="#c89060" stroke="none"/>
    <circle cx="380" cy="244" r="3" fill="#c89060" stroke="none"/>
    <circle cx="360" cy="264" r="3" fill="#c89060" stroke="none"/>
    <circle cx="380" cy="264" r="3" fill="#c89060" stroke="none"/>
    <circle cx="360" cy="284" r="3" fill="#c89060" stroke="none"/>
    <circle cx="380" cy="284" r="3" fill="#c89060" stroke="none"/>
  </g>
