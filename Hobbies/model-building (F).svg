<!-- work bench / stand the model sits on -->
<rect x="56" y="300" width="170" height="14" rx="3" fill="#b98a52" stroke="#1a1a1a" stroke-width="4"/>
<line x1="74" y1="314" x2="74" y2="346" stroke="#8a5a2a" stroke-width="8" stroke-linecap="round"/>
<line x1="208" y1="314" x2="208" y2="346" stroke="#8a5a2a" stroke-width="8" stroke-linecap="round"/>
<!-- a small stand cradling the fuselage -->
<polygon points="128,300 152,300 146,268 134,268" fill="#cfd6de" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
<!-- part-assembled model: fuselage with tail + ONE attached wing -->
<ellipse cx="140" cy="252" rx="72" ry="16" fill="#cfd6de" stroke="#1a1a1a" stroke-width="4"/>
<!-- tail fin (attached) -->
<polygon points="72,252 50,228 56,252 50,276" fill="#cfd6de" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
<!-- top wing already attached -->
<polygon points="128,246 176,206 188,206 158,248" fill="#e0473c" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
<!-- cockpit canopy -->
<circle cx="192" cy="252" r="9" fill="#7ec8f0" stroke="#1a1a1a" stroke-width="3"/>
<!-- nose cone -->
<circle cx="208" cy="252" r="7" fill="#39414b" stroke="#1a1a1a" stroke-width="3"/>
<!-- DETACHED second wing — a loose part lying flat on the bench, waiting to be glued on -->
<polygon points="60,296 116,288 120,298 64,306" fill="#e0473c" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
<!-- large glue tube held in the near hand, nozzle aimed down-left at the seam -->
<g transform="rotate(150 236 276)">
  <rect x="236" y="262" width="66" height="28" rx="10" fill="#e0732a" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="226" y="268" width="12" height="16" rx="2" fill="#f0d089" stroke="#1a1a1a" stroke-width="3"/>
  <polygon points="226,270 206,274 206,278 226,282" fill="#9aa7b3" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
  <line x1="250" y1="270" x2="290" y2="270" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</g>
<!-- glue drop falling onto the wing seam -->
<path d="M 176 290 q -6 8 0 14 q 6 -6 0 -14 Z" fill="#7ec8f0" stroke="#1a1a1a" stroke-width="2"/>
</g></svg>
