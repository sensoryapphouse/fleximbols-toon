  <path d="M 0,400 Q 128,395 256,400 Q 384,405 512,400" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 0,440 Q 128,435 256,440 Q 384,445 512,440" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Outlines -->
