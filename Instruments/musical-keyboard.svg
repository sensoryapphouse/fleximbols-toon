  <!-- Piano keyboard: white keys then black keys on top -->
  <!-- 8 white keys filling the board -->
  <rect x="44" y="160" width="400" height="220" rx="6" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="5"/>
  <!-- White key dividers -->
  <line x1="94" y1="160" x2="94" y2="380" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="144" y1="160" x2="144" y2="380" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="194" y1="160" x2="194" y2="380" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="244" y1="160" x2="244" y2="380" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="294" y1="160" x2="294" y2="380" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="344" y1="160" x2="344" y2="380" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="394" y1="160" x2="394" y2="380" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Black keys (C#, D#, F#, G#, A#) repeated over two octaves -->
  <!-- Octave 1 -->
  <rect x="69" y="160" width="32" height="136" rx="4" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="119" y="160" width="32" height="136" rx="4" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="219" y="160" width="32" height="136" rx="4" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="269" y="160" width="32" height="136" rx="4" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="319" y="160" width="32" height="136" rx="4" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Keyboard body / housing -->
  <rect x="44" y="148" width="400" height="18" rx="4" fill="#888" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Stand legs -->
  <rect x="100" y="380" width="20" height="48" rx="4" fill="#888" stroke="#1a1a1a" stroke-width="5"/>
  <rect x="392" y="380" width="20" height="48" rx="4" fill="#888" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Feet -->
  <rect x="80" y="422" width="60" height="14" rx="5" fill="#666" stroke="#1a1a1a" stroke-width="5"/>
  <rect x="372" y="422" width="60" height="14" rx="5" fill="#666" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Pitch / mod wheels on left side -->
  <rect x="50" y="196" width="24" height="64" rx="8" fill="#ddd" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="82" y="196" width="24" height="64" rx="8" fill="#ddd" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Volume knob -->
  <circle cx="460" cy="220" r="18" fill="#ddd" stroke="#1a1a1a" stroke-width="5"/>
  <line x1="460" y1="204" x2="460" y2="214" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
</svg>
