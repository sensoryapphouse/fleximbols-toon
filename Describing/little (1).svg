  <!-- Tiny figure, centered low, drawn small to emphasise "little" -->
  <!-- Hair -->
  <ellipse cx="256" cy="296" rx="22" ry="9" fill="#5a3825"/>
  <path d="M234 296 Q233 284 256 280 Q279 284 278 296 Z" fill="#5a3825"/>

  <!-- Head -->
  <ellipse cx="256" cy="306" rx="22" ry="24" fill="#f3c89c" stroke="#1a1a1a" stroke-width="4"/>

  <!-- Eyes -->
  <ellipse cx="249" cy="303" rx="2.5" ry="3" fill="#1a1a1a"/>
  <ellipse cx="263" cy="303" rx="2.5" ry="3" fill="#1a1a1a"/>

  <!-- Mouth -->
  <path d="M251 315 Q256 319 261 315" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>

  <!-- Torso -->
  <rect x="244" y="328" width="24" height="34" rx="4" fill="#2a9d8f" stroke="#1a1a1a" stroke-width="4"/>

  <!-- Arms -->
  <line x1="244" y1="334" x2="230" y2="350" stroke="#2a9d8f" stroke-width="10" stroke-linecap="round"/>
  <line x1="244" y1="334" x2="230" y2="350" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="268" y1="334" x2="282" y2="350" stroke="#2a9d8f" stroke-width="10" stroke-linecap="round"/>
  <line x1="268" y1="334" x2="282" y2="350" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Legs -->
  <line x1="250" y1="362" x2="244" y2="392" stroke="#1d3557" stroke-width="12" stroke-linecap="round"/>
  <line x1="250" y1="362" x2="244" y2="392" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="262" y1="362" x2="268" y2="392" stroke="#1d3557" stroke-width="12" stroke-linecap="round"/>
  <line x1="262" y1="362" x2="268" y2="392" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Feet -->
  <ellipse cx="242" cy="395" rx="10" ry="5" fill="#1a1a1a"/>
  <ellipse cx="270" cy="395" rx="10" ry="5" fill="#1a1a1a"/>

  <!-- Inward-pointing arrows from all four sides indicating "small/little" -->
  <!-- Arrow from left -->
  <line x1="60" y1="340" x2="180" y2="340" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <polyline points="168,328 180,340 168,352" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow from right -->
  <line x1="452" y1="340" x2="332" y2="340" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <polyline points="344,328 332,340 344,352" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow from top -->
  <line x1="256" y1="60" x2="256" y2="214" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <polyline points="244,202 256,214 268,202" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow from bottom -->
  <line x1="256" y1="452" x2="256" y2="432" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <polyline points="244,444 256,432 268,444" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
