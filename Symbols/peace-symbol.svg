  <!-- Peace symbol: outer circle, vertical line top to bottom, V-shape splitting downward -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1a1a1a" stroke-width="18"/>
  <!-- Vertical line from top to bottom of circle -->
  <line x1="256" y1="46" x2="256" y2="466" stroke="#1a1a1a" stroke-width="18" stroke-linecap="round"/>
  <!-- Left diagonal (from centre down-left to circle edge) -->
  <line x1="256" y1="256" x2="107" y2="405" stroke="#1a1a1a" stroke-width="18" stroke-linecap="round"/>
  <!-- Right diagonal (from centre down-right to circle edge) -->
  <line x1="256" y1="256" x2="405" y2="405" stroke="#1a1a1a" stroke-width="18" stroke-linecap="round"/>
</svg>
