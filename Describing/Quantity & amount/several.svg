  <!-- Six identical round objects arranged in two rows of 3, suggesting "several" -->

  <!-- Row 1 -->
  <circle cx="130" cy="190" r="58" fill="#e84a4a" stroke="#1a1a1a" stroke-width="5"/>
  <!-- shine -->
  <ellipse cx="110" cy="168" rx="16" ry="10" fill="#ffffff" opacity="0.35"/>

  <circle cx="256" cy="190" r="58" fill="#e84a4a" stroke="#1a1a1a" stroke-width="5"/>
  <ellipse cx="236" cy="168" rx="16" ry="10" fill="#ffffff" opacity="0.35"/>

  <circle cx="382" cy="190" r="58" fill="#e84a4a" stroke="#1a1a1a" stroke-width="5"/>
  <ellipse cx="362" cy="168" rx="16" ry="10" fill="#ffffff" opacity="0.35"/>

  <!-- Row 2 — offset, 3 circles, slightly different shade to give depth -->
  <circle cx="130" cy="330" r="58" fill="#d03838" stroke="#1a1a1a" stroke-width="5"/>
  <ellipse cx="110" cy="308" rx="16" ry="10" fill="#ffffff" opacity="0.30"/>

  <circle cx="256" cy="330" r="58" fill="#d03838" stroke="#1a1a1a" stroke-width="5"/>
  <ellipse cx="236" cy="308" rx="16" ry="10" fill="#ffffff" opacity="0.30"/>

  <circle cx="382" cy="330" r="58" fill="#d03838" stroke="#1a1a1a" stroke-width="5"/>
  <ellipse cx="362" cy="308" rx="16" ry="10" fill="#ffffff" opacity="0.30"/>
</svg>
