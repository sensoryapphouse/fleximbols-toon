<!-- vertical ruler along left side -->
<rect x="60" y="40" width="60" height="432" rx="8" fill="#f0c040" stroke="#1a1a1a" stroke-width="5" />
<!-- major tick marks every 40px, 10 intervals -->
<g stroke="#1a1a1a" stroke-width="4" stroke-linecap="round">
  <line x1="120" y1="60"  x2="152" y2="60"  />
  <line x1="120" y1="100" x2="152" y2="100" />
  <line x1="120" y1="140" x2="152" y2="140" />
  <line x1="120" y1="180" x2="152" y2="180" />
  <line x1="120" y1="220" x2="152" y2="220" />
  <line x1="120" y1="260" x2="152" y2="260" />
  <line x1="120" y1="300" x2="152" y2="300" />
  <line x1="120" y1="340" x2="152" y2="340" />
  <line x1="120" y1="380" x2="152" y2="380" />
  <line x1="120" y1="420" x2="152" y2="420" />
  <line x1="120" y1="460" x2="152" y2="460" />
</g>
<!-- minor tick marks -->
<g stroke="#1a1a1a" stroke-width="3" stroke-linecap="round">
  <line x1="120" y1="80"  x2="140" y2="80"  />
  <line x1="120" y1="120" x2="140" y2="120" />
  <line x1="120" y1="160" x2="140" y2="160" />
  <line x1="120" y1="200" x2="140" y2="200" />
  <line x1="120" y1="240" x2="140" y2="240" />
  <line x1="120" y1="280" x2="140" y2="280" />
  <line x1="120" y1="320" x2="140" y2="320" />
  <line x1="120" y1="360" x2="140" y2="360" />
  <line x1="120" y1="400" x2="140" y2="400" />
  <line x1="120" y1="440" x2="140" y2="440" />
</g>
<!-- double-headed vertical arrow indicating height -->
<line x1="340" y1="60" x2="340" y2="460" stroke="#1f6dc2" stroke-width="10" stroke-linecap="round" />
<!-- arrowhead top -->
<polygon points="340,40 318,80 362,80" fill="#1f6dc2" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round" />
<!-- arrowhead bottom -->
<polygon points="340,480 318,440 362,440" fill="#1f6dc2" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round" />
<!-- horizontal dashed lines connecting arrow to ruler at top and bottom -->
<line x1="120" y1="60"  x2="330" y2="60"  stroke="#1a1a1a" stroke-width="3" stroke-dasharray="8 6" />
<line x1="120" y1="460" x2="330" y2="460" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="8 6" />
</svg>
