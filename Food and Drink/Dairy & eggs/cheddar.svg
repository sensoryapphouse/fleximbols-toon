<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <g stroke="#1a1a1a" stroke-linejoin="round" stroke-linecap="round">

    <!-- Shadow / base -->
    <ellipse cx="272" cy="438" rx="148" ry="22" fill="#c8a04a" opacity="0.35" stroke="none"/>

    <!-- Back face of wedge (top slant) -->
    <!-- Wedge shape: a triangular/trapezoidal cheese wedge pointing left -->
    <!-- Main body: front face (large quadrilateral) -->
    <polygon
      points="90,390  420,320  420,160  90,160"
      fill="#e8991a"
      stroke="#1a1a1a"
      stroke-width="5"
    />

    <!-- Top face (the cut face going to the point) -->
    <!-- Wedge tip is at left; the top slants from back-top-right down to tip -->
    <!-- Top slanted face -->
    <polygon
      points="90,160  420,160  420,100  90,100"
      fill="#f5b833"
      stroke="#1a1a1a"
      stroke-width="5"
    />

    <!-- Rind strip on front face (bottom) -->
    <polygon
      points="90,390  420,320  420,350  90,420"
      fill="#c47a10"
      stroke="#1a1a1a"
      stroke-width="5"
    />

    <!-- Rind strip on top face (back edge) -->
    <rect
      x="90" y="100" width="330" height="18"
      rx="4"
      fill="#b86a0a"
      stroke="#1a1a1a"
      stroke-width="1"
    />

    <!-- Left cut-face (the triangular slice face at the tip) -->
    <polygon
      points="90,100  90,160  90,390  90,420  52,405  52,115"
      fill="#f0a820"
      stroke="#1a1a1a"
      stroke-width="5"
    />

    <!-- Holes on the front face -->
    <ellipse cx="200" cy="240" rx="22" ry="18" fill="#c47a10" stroke="#1a1a1a" stroke-width="1"/>
    <ellipse cx="310" cy="265" rx="28" ry="22" fill="#c47a10" stroke="#1a1a1a" stroke-width="1"/>
    <ellipse cx="370" cy="210" rx="18" ry="14" fill="#c47a10" stroke="#1a1a1a" stroke-width="1"/>
    <ellipse cx="250" cy="320" rx="16" ry="13" fill="#c47a10" stroke="#1a1a1a" stroke-width="1"/>
    <ellipse cx="155" cy="310" rx="13" ry="11" fill="#c47a10" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Highlight on top face -->
    <polygon
      points="120,104  380,104  380,118  120,118"
      fill="#ffd060"
      stroke="none"
      opacity="0.5"
    />

  </g>
</svg>
