  <!-- Table tennis paddle rotated ~-35 deg, ball top-right -->
  <g transform="rotate(-35 256 300)">
    <!-- Paddle blade -->
    <ellipse cx="230" cy="220" rx="120" ry="130" fill="#cf3a2c" stroke="#1a1a1a" stroke-width="5" />
    <!-- Blade shadow half -->
    <path d="M230 90 a120 130 0 0 1 0 260 a120 130 0 0 0 0 -260 Z" fill="#a82c20" stroke="none" />
    <!-- Blade outline -->
    <ellipse cx="230" cy="220" rx="120" ry="130" fill="none" stroke="#1a1a1a" stroke-width="5" />
    <!-- Rubber sheet edge line -->
    <ellipse cx="230" cy="220" rx="106" ry="116" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="10,6" opacity="0.6" />
    <!-- Handle -->
    <path d="M206 350 L192 460 Q190 478 215 478 Q240 478 238 460 L255 350 Z" fill="#8a5a32" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round" />
    <!-- Handle grip wrap lines -->
    <line x1="196" y1="380" x2="252" y2="375" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="194" y1="400" x2="250" y2="395" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="192" y1="420" x2="247" y2="415" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="191" y1="440" x2="244" y2="436" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  </g>
  <!-- Ball -->
  <circle cx="390" cy="105" r="48" fill="#f5e23a" stroke="#1a1a1a" stroke-width="5" />
  <!-- Ball seam curve -->
  <path d="M346 88 Q390 130 434 112" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" />
  <!-- Ball highlight -->
  <circle cx="374" cy="88" r="14" fill="#ffffff" opacity="0.55" />
</svg>
