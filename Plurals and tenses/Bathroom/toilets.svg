  <title>toilet</title>
  <g stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cistern (tank) -->
    <rect x="170" y="60" width="172" height="170" rx="14" fill="#bfd9ea" />
    <rect x="186" y="76" width="140" height="84" rx="6" fill="#79a8c4" />
    <rect x="246" y="180" width="20" height="22" rx="4" fill="#1a1a1a" stroke="none" />

    <!-- Pedestal/base (behind the seat) -->
    <path d="M180 300 Q190 440 256 440 Q322 440 332 300 Z" fill="#dbe7ef" />

    <!-- Seat ring (the actual toilet seat — annulus shape with evenodd fill) -->
