  <!-- Globe body -->
  <circle cx="256" cy="220" r="170" fill="#006CA2" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>

  <!-- Latitude lines -->
  <ellipse cx="256" cy="220" rx="170" ry="50"  fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <ellipse cx="256" cy="220" rx="170" ry="100" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <ellipse cx="256" cy="220" rx="170" ry="150" fill="none" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Central vertical meridian -->
  <ellipse cx="256" cy="220" rx="1"   ry="170" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Left/right meridians -->
  <ellipse cx="256" cy="220" rx="100" ry="170" fill="none" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Globe outline again on top to clean up -->
  <circle cx="256" cy="220" r="170" fill="none" stroke="#1a1a1a" stroke-width="5"/>

  <!-- Wifi dot at bottom-centre of globe -->
  <circle cx="256" cy="415" r="14" fill="#2a5fa8" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Wifi arcs — centred on 256, arcing upward from the dot -->
  <!-- Small arc -->
  <path d="M 220 388 a 46 46 0 0 1 72 0"
        fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <!-- Medium arc -->
  <path d="M 192 360 a 80 80 0 0 1 128 0"
        fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <!-- Large arc -->
  <path d="M 160 330 a 116 116 0 0 1 192 0"
        fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>

</svg>
