<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Handheld digital multimeter with display, rotary dial, and probes -->

  <!-- Body of multimeter — rounded rectangle, portrait orientation -->
  <rect x="112" y="50" width="248" height="360" rx="36" ry="36"
        fill="#2a2a2a" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Body highlight strip -->
  <rect x="118" y="56" width="80" height="348" rx="30" ry="30" fill="#383838" opacity="0.5"/>

  <!-- Display screen bezel -->
  <rect x="138" y="80" width="196" height="110" rx="10" ry="10"
        fill="#1a1a1a" stroke="#1a1a1a" stroke-width="4"/>
  <!-- Display screen -->
  <rect x="146" y="88" width="180" height="94" rx="6" ry="6" fill="#b8e8b0"/>
  <!-- Display digits (simple "1.98 V" shapes using rects) -->
  <rect x="158" y="100" width="6" height="36" rx="2" fill="#1a3a1a"/>
  <rect x="170" y="100" width="6" height="16" rx="2" fill="#1a3a1a"/>
  <rect x="170" y="120" width="6" height="16" rx="2" fill="#1a3a1a"/>
  <rect x="164" y="100" width="12" height="6" rx="2" fill="#1a3a1a"/>
  <rect x="164" y="117" width="12" height="5" rx="2" fill="#1a3a1a"/>
  <rect x="164" y="132" width="12" height="6" rx="2" fill="#1a3a1a"/>
  <!-- Decimal dot -->
  <circle cx="185" cy="138" r="4" fill="#1a3a1a"/>
  <!-- Second digit -->
  <rect x="193" y="100" width="6" height="16" rx="2" fill="#1a3a1a"/>
  <rect x="193" y="120" width="6" height="16" rx="2" fill="#1a3a1a"/>
  <rect x="193" y="100" width="18" height="6" rx="2" fill="#1a3a1a"/>
  <rect x="193" y="117" width="18" height="5" rx="2" fill="#1a3a1a"/>
  <rect x="193" y="132" width="18" height="6" rx="2" fill="#1a3a1a"/>
  <rect x="205" y="100" width="6" height="36" rx="2" fill="#1a3a1a"/>
  <!-- Unit label -->
  <rect x="222" y="110" width="18" height="6" rx="2" fill="#1a3a1a" opacity="0.6"/>
  <rect x="222" y="122" width="14" height="6" rx="2" fill="#1a3a1a" opacity="0.6"/>
  <rect x="222" y="134" width="18" height="5" rx="2" fill="#1a3a1a" opacity="0.6"/>
  <!-- Auto/DC label bar -->
  <rect x="152" y="158" width="40" height="8" rx="3" fill="#1a3a1a" opacity="0.5"/>
  <rect x="200" y="158" width="30" height="8" rx="3" fill="#1a3a1a" opacity="0.5"/>

  <!-- Rotary selector dial -->
  <circle cx="236" cy="280" r="62" fill="#404040" stroke="#1a1a1a" stroke-width="5"/>
  <circle cx="236" cy="280" r="50" fill="#303030" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Dial position marker (pointed to voltage) -->
  <path d="M236,238 L228,268 L236,264 L244,268 Z" fill="#f0d040" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Dial ring markings -->
  <line x1="236" y1="232" x2="236" y2="242" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="282" y1="248" x2="276" y2="256" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="294" y1="280" x2="284" y2="280" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="282" y1="312" x2="276" y2="304" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="236" y1="328" x2="236" y2="318" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="312" x2="196" y2="304" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="178" y1="280" x2="188" y2="280" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="248" x2="196" y2="256" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <!-- Center knob -->
  <circle cx="236" cy="280" r="18" fill="#505050" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="236" cy="280" r="8" fill="#666" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Bottom probe sockets (three holes) -->
  <circle cx="176" cy="378" r="12" fill="#111" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="236" cy="378" r="12" fill="#111" stroke="#e84444" stroke-width="4"/>
  <circle cx="296" cy="378" r="12" fill="#111" stroke="#e84444" stroke-width="4"/>
  <!-- Socket labels (small rects) -->
  <rect x="168" y="392" width="16" height="5" rx="2" fill="#888"/>
  <rect x="228" y="392" width="16" height="5" rx="2" fill="#888"/>
  <rect x="288" y="392" width="16" height="5" rx="2" fill="#888"/>

  <!-- Black probe cable + probe going down-left -->
  <path d="M176,390 Q150,420 120,440 Q100,452 82,466"
        fill="none" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round"/>
  <!-- Black probe tip -->
  <line x1="82" y1="466" x2="66" y2="490" stroke="#2a2a2a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="66" cy="490" r="5" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Red probe cable going down-right -->
  <path d="M296,390 Q328,420 360,438 Q390,454 420,470"
        fill="none" stroke="#e84444" stroke-width="6" stroke-linecap="round"/>
  <!-- Red probe tip -->
  <line x1="420" y1="470" x2="440" y2="494" stroke="#e84444" stroke-width="5" stroke-linecap="round"/>
  <circle cx="440" cy="494" r="5" fill="#e84444" stroke="#1a1a1a" stroke-width="3"/>
<g transform="translate(360 8) scale(0.2812)"><defs><radialGradient id="pl3229" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl3229)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
