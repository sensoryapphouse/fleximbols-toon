<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Cork pinboard with pinned papers/notes -->
  <!-- Board frame (wooden) -->
  <rect x="40" y="55" width="432" height="402" rx="10" fill="#7a4a22" stroke="#1a1a1a" stroke-width="5" />
  <!-- Cork surface -->
  <rect x="58" y="73" width="396" height="366" rx="6" fill="#c8904a" stroke="#1a1a1a" stroke-width="1" />
  <!-- Cork texture patches -->
  <ellipse cx="120" cy="150" rx="28" ry="18" fill="#b87830" opacity="0.5" />
  <ellipse cx="320" cy="220" rx="36" ry="22" fill="#b87830" opacity="0.45" />
  <ellipse cx="200" cy="360" rx="30" ry="16" fill="#b87830" opacity="0.4" />
  <ellipse cx="400" cy="340" rx="24" ry="20" fill="#b87830" opacity="0.45" />
  <ellipse cx="90" cy="380" rx="20" ry="14" fill="#b87830" opacity="0.38" />

  <!-- Note 1 — white paper, slightly rotated left -->
  <g transform="rotate(-6 185 200)">
    <rect x="85" y="130" width="130" height="110" rx="4" fill="#fffde8" stroke="#1a1a1a" stroke-width="1" />
    <line x1="103" y1="160" x2="197" y2="160" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
    <line x1="103" y1="178" x2="197" y2="178" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
    <line x1="103" y1="196" x2="175" y2="196" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
    <!-- Red pin -->
    <circle cx="150" cy="138" r="9" fill="#e03030" stroke="#1a1a1a" stroke-width="1" />
    <line x1="150" y1="147" x2="150" y2="156" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Note 2 — yellow sticky note, slightly rotated right -->
  <g transform="rotate(5 310 180)">
    <rect x="235" y="110" width="118" height="118" rx="4" fill="#fff176" stroke="#1a1a1a" stroke-width="1" />
    <!-- Folded corner -->
    <path d="M335 110 L353 128 L335 128 Z" fill="#e6d940" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round" />
    <line x1="253" y1="148" x2="333" y2="148" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
    <line x1="253" y1="164" x2="333" y2="164" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
    <line x1="253" y1="180" x2="310" y2="180" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
    <!-- Blue pin -->
    <circle cx="294" cy="118" r="9" fill="#2060d0" stroke="#1a1a1a" stroke-width="1" />
    <line x1="294" y1="127" x2="294" y2="136" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Note 3 — white paper, lower area, slight tilt right -->
  <g transform="rotate(4 330 350)">
    <rect x="290" y="270" width="100" height="140" rx="4" fill="#e8f4ff" stroke="#1a1a1a" stroke-width="1" />
    <line x1="306" y1="302" x2="374" y2="302" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
    <line x1="306" y1="320" x2="374" y2="320" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
    <line x1="306" y1="338" x2="374" y2="338" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
    <line x1="306" y1="356" x2="360" y2="356" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
    <!-- Green pin -->
    <circle cx="340" cy="278" r="9" fill="#30a050" stroke="#1a1a1a" stroke-width="1" />
    <line x1="340" y1="287" x2="340" y2="296" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Note 4 — small note bottom-left, no tilt -->
  <rect x="75" y="300" width="110" height="100" rx="4" fill="#ffe0e0" stroke="#1a1a1a" stroke-width="1" />
  <line x1="91" y1="330" x2="167" y2="330" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
  <line x1="91" y1="348" x2="167" y2="348" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
  <line x1="91" y1="366" x2="150" y2="366" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
  <!-- Yellow pin -->
  <circle cx="130" cy="308" r="9" fill="#f0c030" stroke="#1a1a1a" stroke-width="1" />
  <line x1="130" y1="317" x2="130" y2="326" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round" />

  <!-- Hanging bracket top-left -->
  <circle cx="80" cy="65" r="8" fill="#7a4a22" stroke="#1a1a1a" stroke-width="1" />
  <!-- Hanging bracket top-right -->
  <circle cx="432" cy="65" r="8" fill="#7a4a22" stroke="#1a1a1a" stroke-width="1" />
</svg>
