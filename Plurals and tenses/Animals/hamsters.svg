  <!-- Cartoon hamster: round body, big cheek pouches, small ears, beady eyes, tiny nose, short legs -->

  <!-- Body (round, tan/brown) -->
  <ellipse cx="256" cy="320" rx="130" ry="110"
           fill="#c89050" stroke="#1a1a1a" stroke-width="5" />

  <!-- Belly patch (lighter) -->
  <ellipse cx="256" cy="340" rx="80" ry="72"
           fill="#f0daa8" stroke="none" />

  <!-- Cheek pouches (rounded bulges on the face) -->
  <ellipse cx="180" cy="252" rx="46" ry="38"
           fill="#d4a060" stroke="#1a1a1a" stroke-width="5" />
  <ellipse cx="332" cy="252" rx="46" ry="38"
           fill="#d4a060" stroke="#1a1a1a" stroke-width="5" />

  <!-- Head (round, sits on top of body) -->
  <ellipse cx="256" cy="220" rx="100" ry="90"
           fill="#c89050" stroke="#1a1a1a" stroke-width="5" />

  <!-- Ears (small, round, slightly behind head) -->
  <circle cx="178" cy="148" r="34"
          fill="#c89050" stroke="#1a1a1a" stroke-width="5" />
  <circle cx="178" cy="148" r="18"
          fill="#e8a080" stroke="none" />
  <circle cx="334" cy="148" r="34"
          fill="#c89050" stroke="#1a1a1a" stroke-width="5" />
  <circle cx="334" cy="148" r="18"
          fill="#e8a080" stroke="none" />

  <!-- Eyes (dark, beady) -->
  <circle cx="220" cy="204" r="14"
          fill="#1a1a1a" stroke="#1a1a1a" stroke-width="4" />
  <circle cx="292" cy="204" r="14"
          fill="#1a1a1a" stroke="#1a1a1a" stroke-width="4" />
  <!-- Eye shine -->
  <circle cx="214" cy="198" r="4" fill="#ffffff" />
  <circle cx="286" cy="198" r="4" fill="#ffffff" />

  <!-- Nose (small, round) -->
  <ellipse cx="256" cy="232" rx="10" ry="8"
           fill="#e07060" stroke="#1a1a1a" stroke-width="3" />

  <!-- Whiskers -->
  <line x1="246" y1="238" x2="196" y2="228" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
  <line x1="246" y1="242" x2="192" y2="248" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
  <line x1="266" y1="238" x2="316" y2="228" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
  <line x1="266" y1="242" x2="320" y2="248" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />

  <!-- Front feet (tiny, peeking at bottom) -->
  <ellipse cx="210" cy="424" rx="26" ry="16"
           fill="#c89050" stroke="#1a1a1a" stroke-width="5" />
  <ellipse cx="302" cy="424" rx="26" ry="16"
           fill="#c89050" stroke="#1a1a1a" stroke-width="5" />

  <!-- Tiny toes on each foot -->
  <line x1="195" y1="430" x2="192" y2="440" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
  <line x1="208" y1="432" x2="207" y2="442" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
  <line x1="220" y1="432" x2="221" y2="442" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
  <line x1="288" y1="432" x2="286" y2="442" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
  <line x1="302" y1="432" x2="301" y2="442" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
  <line x1="316" y1="430" x2="318" y2="440" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />

  <!-- Tiny stub tail -->
  <ellipse cx="372" cy="388" rx="18" ry="12"
           fill="#f0daa8" stroke="#1a1a1a" stroke-width="4" />
<g transform="translate(360 8) scale(0.2812)"><defs><radialGradient id="pl478" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl478)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
