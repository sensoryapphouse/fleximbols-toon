    <!-- neck: filled column from body up to head -->
    <path d="M104 132 Q84 92 110 64 L132 70 Q116 100 124 134 Z" fill="#f9f9f9"/>
    <!-- folded wing -->
    <path d="M120 130 Q170 122 210 150 Q190 172 150 172 Q120 168 120 130 Z" fill="#e3e3e3"/>
