<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a1e08"/>
      <stop offset="50%" stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#3a1e08"/>
    </linearGradient>
    <linearGradient id="bodyTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d0"/>
      <stop offset="100%" stop-color="#c8b898"/>
    </linearGradient>
  </defs>

  <!-- ============ BODY (square resonator box) ============ -->
  <!-- Shadow / side face -->
  <path d="M148 352 L152 428 L364 428 L360 352 Z"
        fill="#7a5828" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  <!-- Top face of box -->
  <rect x="148" y="300" width="212" height="56" rx="8"
        fill="url(#bodyTop)" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  <!-- Front face of box -->
  <rect x="148" y="352" width="212" height="76" rx="6"
        fill="#e8dcc0" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>

  <!-- Skin membrane lines on top face -->
  <line x1="158" y1="310" x2="350" y2="310"
        stroke="#1a1a1a" stroke-width="2" opacity="0.4"/>
  <line x1="158" y1="340" x2="350" y2="340"
        stroke="#1a1a1a" stroke-width="2" opacity="0.4"/>

  <!-- Sound hole (circular, on front face) -->
  <circle cx="254" cy="390" r="22"
          fill="#3a1e08" stroke="#1a1a1a" stroke-width="4"/>

  <!-- ============ NECK ============ -->
  <!-- Neck runs from top of body up to headstock -->
  <rect x="238" y="68" width="28" height="240"
        fill="url(#neckGrad)" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>

  <!-- Nut (just above body) -->
  <rect x="234" y="295" width="36" height="10" rx="2"
        fill="#d4c08a" stroke="#1a1a1a" stroke-width="3"/>

  <!-- ============ HEADSTOCK ============ -->
  <!-- Headstock shape: wider, slight splay -->
  <path d="M238 68 Q220 52 222 30 L290 30 Q292 52 274 68 Z"
        fill="#3a1e08" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>

  <!-- Tuning pegs — 3 pegs (shamisen has 3 strings) -->
  <!-- Left peg -->
  <rect x="196" y="40" width="34" height="10" rx="3"
        fill="#f5d590" stroke="#1a1a1a" stroke-width="3" transform="rotate(-10 213 45)"/>
  <circle cx="196" cy="44" r="7"
          fill="#3a1e08" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Right peg 1 -->
  <rect x="282" y="36" width="34" height="10" rx="3"
        fill="#f5d590" stroke="#1a1a1a" stroke-width="3" transform="rotate(10 299 41)"/>
  <circle cx="316" cy="42" r="7"
          fill="#3a1e08" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Right peg 2 (lower) -->
  <rect x="282" y="54" width="34" height="10" rx="3"
        fill="#f5d590" stroke="#1a1a1a" stroke-width="3" transform="rotate(10 299 59)"/>
  <circle cx="316" cy="60" r="7"
          fill="#3a1e08" stroke="#1a1a1a" stroke-width="3"/>

  <!-- ============ STRINGS (3) ============ -->
  <line x1="203" y1="44" x2="212" y2="390"
        stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="254" y1="30" x2="254" y2="390"
        stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="313" y1="50" x2="298" y2="390"
        stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ============ BACHI (plectrum) ============ -->
  <!-- Fan-shaped plectrum resting against body -->
  <path d="M360 310 Q400 290 420 340 Q410 370 380 365 Q350 355 360 310 Z"
        fill="#f0e2c0" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  <!-- Handle of bachi -->
  <rect x="348" y="298" width="16" height="26" rx="4"
        fill="#3a1e08" stroke="#1a1a1a" stroke-width="4"
        transform="rotate(-20 356 311)"/>
<g transform="translate(360 8) scale(0.2812)"><defs><radialGradient id="pl2433" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl2433)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
