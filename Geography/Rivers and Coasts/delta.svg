  <!-- Right major branch -->
  <path d="M 256,240 Q 292,280 322,320 Q 352,360 382,420 L 357,425 Q 330,368 302,328 Q 274,288 252,248 Z" fill="#2277bb"/>
  <!-- Left sub-branch -->
  <path d="M 195,330 Q 165,360 140,400 L 155,405 Q 178,368 203,338 Z" fill="#2277bb"/>
  <!-- Right sub-branch -->
  <path d="M 317,330 Q 347,360 372,400 L 357,405 Q 334,368 309,338 Z" fill="#2277bb"/>
  <!-- Far left branch -->
  <path d="M 155,380 Q 120,410 90,450 L 108,455 Q 134,418 163,388 Z" fill="#2277bb"/>
  <!-- Far right branch -->
  <path d="M 357,380 Q 392,410 422,450 L 404,455 Q 378,418 349,388 Z" fill="#2277bb"/>
