<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <!-- Head opening shape used as clip for the net -->
    <clipPath id="lax_head">
      <path d="M 360 80 Q 460 80 460 180 Q 460 260 360 240 Q 290 230 290 160 Q 290 80 360 80 Z"/>
    </clipPath>
  </defs>

  <!-- Handle (diagonal) -->
  <line x1="80" y1="450" x2="340" y2="180" stroke="#5a4a32" stroke-width="22" stroke-linecap="round"/>
  <line x1="80" y1="450" x2="340" y2="180" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>

  <!-- Head opening backing (cream/net background) -->
  <path d="M 360 80 Q 460 80 460 180 Q 460 260 360 240 Q 290 230 290 160 Q 290 80 360 80 Z"
        fill="#f4ead0" stroke="none"/>

  <!-- NET — dense cross-hatch, clipped to head opening -->
  <g clip-path="url(#lax_head)" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <!-- diagonal lines bottom-left to top-right -->
    <line x1="280" y1="80"  x2="480" y2="280"/>
    <line x1="280" y1="100" x2="480" y2="300"/>
    <line x1="280" y1="120" x2="480" y2="320"/>
    <line x1="280" y1="140" x2="480" y2="340"/>
    <line x1="280" y1="160" x2="480" y2="360"/>
    <line x1="280" y1="180" x2="480" y2="380"/>
    <line x1="280" y1="200" x2="480" y2="400"/>
    <line x1="280" y1="220" x2="480" y2="420"/>
    <line x1="280" y1="60"  x2="480" y2="260"/>
    <line x1="280" y1="40"  x2="480" y2="240"/>
    <!-- diagonal lines top-left to bottom-right -->
    <line x1="280" y1="280" x2="480" y2="80"/>
    <line x1="280" y1="260" x2="480" y2="60"/>
    <line x1="280" y1="240" x2="480" y2="40"/>
    <line x1="280" y1="220" x2="480" y2="20"/>
    <line x1="280" y1="300" x2="480" y2="100"/>
    <line x1="280" y1="320" x2="480" y2="120"/>
    <line x1="280" y1="340" x2="480" y2="140"/>
    <line x1="280" y1="360" x2="480" y2="160"/>
    <line x1="280" y1="380" x2="480" y2="180"/>
    <line x1="280" y1="400" x2="480" y2="200"/>
  </g>

  <!-- Head rim (drawn on top of the net) -->
  <path d="M 360 80 Q 460 80 460 180 Q 460 260 360 240 Q 290 230 290 160 Q 290 80 360 80 Z"
        fill="none" stroke="#1a1a1a" stroke-width="6"/>

  <!-- Where the head meets the handle -->
  <line x1="310" y1="220" x2="340" y2="190" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>

  <!-- Ball inside the net -->
  <circle cx="380" cy="170" r="22" fill="#ee6d01" stroke="#1a1a1a" stroke-width="5"/>
  <ellipse cx="372" cy="162" rx="6" ry="3" fill="#ffffff" opacity="0.7"/>
</svg>
