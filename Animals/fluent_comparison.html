<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; background: #e0e0e0; margin: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
  .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; }
  img { max-width: 100%; height: 200px; }
  h2 { color: #333; }
</style>
</head>
<body>
  <h1>High-Quality Fluent SVGs</h1>
  <div class="grid">

    <div class="card">
      <h2>Salamander</h2>
      <img src="fluent_salamander.svg" />
    </div>

    <div class="card">
      <h2>Newt</h2>
      <img src="fluent_newt.svg" />
    </div>

    <div class="card">
      <h2>Quail</h2>
      <img src="fluent_quail.svg" />
    </div>

    <div class="card">
      <h2>Bird</h2>
      <img src="fluent_bird.svg" />
    </div>

    <div class="card">
      <h2>Partridge</h2>
      <img src="fluent_partridge.svg" />
    </div>

    <div class="card">
      <h2>Shark</h2>
      <img src="fluent_shark.svg" />
    </div>

    <div class="card">
      <h2>Pterodactyl1</h2>
      <img src="fluent_pterodactyl1.svg" />
    </div>

    <div class="card">
      <h2>Pterodactyl2</h2>
      <img src="fluent_pterodactyl2.svg" />
    </div>

    <div class="card">
      <h2>Sheep</h2>
      <img src="fluent_sheep.svg" />
    </div>

    <div class="card">
      <h2>Worm</h2>
      <img src="fluent_worm.svg" />
    </div>
</div></body></html>
