  <!-- dashing-away: person running to the right with speed/dust lines behind -->

  <!-- Dust cloud / speed puff (left side, behind figure) -->
  <ellipse cx="90" cy="390" rx="70" ry="30" fill="#e8e0d0" stroke="#1a1a1a" stroke-width="4" opacity="0.85" />
  <ellipse cx="60" cy="378" rx="38" ry="22" fill="#e8e0d0" stroke="#1a1a1a" stroke-width="4" opacity="0.75" />
  <ellipse cx="110" cy="372" rx="28" ry="18" fill="#e8e0d0" stroke="#1a1a1a" stroke-width="4" opacity="0.7" />

  <!-- Speed lines (horizontal, behind figure) -->
  <line x1="30" y1="300" x2="180" y2="295" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" opacity="0.5" />
  <line x1="20" y1="318" x2="160" y2="314" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <line x1="40" y1="338" x2="170" y2="335" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" opacity="0.35" />
  <line x1="30" y1="356" x2="155" y2="354" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <line x1="50" y1="376" x2="155" y2="374" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" opacity="0.3" />

  <!-- Ground line -->
  <line x1="100" y1="430" x2="480" y2="430" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" />

  <!-- Running figure — leaning forward, mid-stride -->

  <!-- Back leg (extended behind) -->
  <line x1="310" y1="350" x2="260" y2="420" stroke="#1a1a1a" stroke-width="18" stroke-linecap="round" />
  <line x1="310" y1="350" x2="260" y2="420" stroke="#2b2a6e" stroke-width="10" stroke-linecap="round" />
  <!-- Back foot -->
  <ellipse cx="255" cy="425" rx="22" ry="10" fill="#1a1a1a" />

  <!-- Front leg (forward stride) -->
  <line x1="310" y1="350" x2="370" y2="415" stroke="#1a1a1a" stroke-width="18" stroke-linecap="round" />
  <line x1="310" y1="350" x2="370" y2="415" stroke="#2b2a6e" stroke-width="10" stroke-linecap="round" />
  <!-- Front foot -->
  <ellipse cx="378" cy="422" rx="24" ry="11" fill="#1a1a1a" />

  <!-- Torso (leaning forward) -->
  <path d="M290 240 L340 250 L340 350 L280 350 Z" fill="#e63946" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round" />

  <!-- Back arm (swinging back) -->
  <path d="M290 268 Q240 310 222 340" stroke="#1a1a1a" stroke-width="18" stroke-linecap="round" fill="none" />
  <path d="M290 268 Q240 310 222 340" stroke="#e63946" stroke-width="10" stroke-linecap="round" fill="none" />
  <circle cx="218" cy="344" r="13" fill="#f3c89c" stroke="#1a1a1a" stroke-width="5" />

  <!-- Front arm (swinging forward) -->
  <path d="M330 265 Q380 295 400 318" stroke="#1a1a1a" stroke-width="18" stroke-linecap="round" fill="none" />
  <path d="M330 265 Q380 295 400 318" stroke="#e63946" stroke-width="10" stroke-linecap="round" fill="none" />
  <circle cx="404" cy="322" r="13" fill="#f3c89c" stroke="#1a1a1a" stroke-width="5" />

  <!-- Neck -->
  <rect x="298" y="218" width="26" height="28" rx="8" fill="#f3c89c" stroke="#1a1a1a" stroke-width="5" />

  <!-- Head (leaning slightly forward) -->
  <circle cx="314" cy="192" r="46" fill="#f3c89c" stroke="#1a1a1a" stroke-width="5" />

  <!-- Hair -->
  <path d="M270 176 Q284 148 314 146 Q344 148 360 176 Q348 156 314 154 Q280 156 270 176 Z" fill="#3a2a18" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round" />

  <!-- Eyes (wide, determined) -->
  <ellipse cx="300" cy="188" rx="6" ry="7" fill="#1a1a1a" />
  <ellipse cx="328" cy="188" rx="6" ry="7" fill="#1a1a1a" />

  <!-- Eye whites -->
  <circle cx="302" cy="186" r="2.5" fill="#ffffff" />
  <circle cx="330" cy="186" r="2.5" fill="#ffffff" />

  <!-- Mouth (open, running) -->
  <path d="M302 204 Q314 212 326 204" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- Small motion lines near feet -->
  <line x1="248" y1="408" x2="228" y2="400" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <line x1="252" y1="416" x2="228" y2="412" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" opacity="0.5" />
</svg>
